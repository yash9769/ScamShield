<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield — Web SOC Threat Analytics Dashboard</title>
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --accent-cyan: #06B6D4;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-amber: #F59E0B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
        }
        .header {
            background-color: var(--bg-card);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .shield-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-cyan), #3B82F6);
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: #000;
            font-weight: bold;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .container {
            max-width: 1300px;
            margin: 32px auto;
            padding: 0 24px;
        }
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-cyan);
        }
        .table-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        th {
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-scam {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .badge-safe {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="shield-icon">⚡</div>
            <span>SCAMSHIELD <span style="color: var(--accent-cyan); font-size: 14px;">SOC PORTAL</span></span>
        </div>
        <div class="status-badge">● LIVE SERVER ACTIVE</div>
    </div>

    <div class="container">
        <div class="grid-stats">
            <div class="card">
                <div class="card-title">VirusTotal Engine</div>
                <div class="card-value" id="vt-status">AUTHENTICATED</div>
            </div>
            <div class="card">
                <div class="card-title">Google Safe Browsing</div>
                <div class="card-value" id="gsb-status">AUTHENTICATED</div>
            </div>
            <div class="card">
                <div class="card-title">AbuseIPDB Threat Intelligence</div>
                <div class="card-value" id="abuse-status">AUTHENTICATED</div>
            </div>
            <div class="card">
                <div class="card-title">Total Security Audit Events</div>
                <div class="card-value" id="total-audits">0</div>
            </div>
        </div>

        <div class="table-section">
            <h3 style="margin: 0; font-size: 18px;">Recent Threat Audit Stream</h3>
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Scan Event</th>
                        <th>Target Input</th>
                        <th>Risk Score</th>
                        <th>Verdict</th>
                    </tr>
                </thead>
                <tbody id="audit-table-body">
                    <tr><td colspan="5" style="color: var(--text-sub); text-align: center;">Loading security audit logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // The admin key is read from ?key= once (for local convenience only)
        // but is NEVER re-sent as a query parameter — query strings land in
        // browser history, proxy access logs and Referer headers. It is only
        // ever sent as the X-Admin-Key request header below. There is no
        // hardcoded fallback key: without a key, the dashboard prompts for one.
        const urlParams = new URLSearchParams(window.location.search);
        let adminKey = urlParams.get('key');
        if (urlParams.has('key')) {
            // Strip the key out of the visible URL/history immediately.
            urlParams.delete('key');
            const clean = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
            window.history.replaceState({}, '', clean);
        }
        if (!adminKey) {
            adminKey = window.prompt('Enter admin key to view the audit dashboard:') || '';
        }

        async function loadDashboardData() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('total-audits').innerText = data.total_audit_events || 0;

                const logsRes = await fetch('/api/audit-logs', {
                    headers: { 'X-Admin-Key': adminKey }
                });
                if (logsRes.ok) {
                    const logs = await logsRes.json();
                    const tbody = document.getElementById('audit-table-body');
                    if (logs.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-sub); text-align: center;">No audit logs recorded yet. Perform a scan in app to see live stream!</td></tr>';
                        return;
                    }
                    tbody.innerHTML = logs.map(l => `
                        <tr>
                            <td>${l.timestamp}</td>
                            <td style="text-transform: uppercase; font-weight: bold; color: var(--accent-cyan);">${l.event_type}</td>
                            <td>${l.target}</td>
                            <td style="font-weight: bold;">${l.risk_score}/100</td>
                            <td><span class="${l.risk_level.toLowerCase() === 'scam' || l.risk_level.toLowerCase() === 'high' ? 'badge-scam' : 'badge-safe'}">${l.risk_level}</span></td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error("Dashboard error:", e);
            }
        }
        loadDashboardData();
        setInterval(loadDashboardData, 5000);
    </script>
</body>
</html>
