# backend/alembic.ini
# Alembic configuration for ScamShield backend.
#
# The database URL is NOT hardcoded here — it is read from the application
# settings (DATABASE_URL env var) in migrations/env.py so migrations always
# target the same database the API uses.

[alembic]
# Path to the migrations scripts directory
script_location = migrations

# Template used to generate new migration files
file_template = %%(rev)s_%%(slug)s

# Sys path — allows alembic to import the app package when run from backend/
prepend_sys_path = .
path_separator = os

# Version numbering: use the revision id directly
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
