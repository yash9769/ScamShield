# Render blueprint: deploys server/ (the API the Flutter app calls).
# Keys are NOT stored here. Fill them in the Render dashboard (sync: false).
services:
  - type: web
    name: scamshield-api
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
